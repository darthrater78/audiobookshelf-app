name: Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A commit reaching the default branch proves nothing on its own about
  # whether CI passed on it -- only that it was merged. This job checks both
  # before anything gets built, signed or published.
  gate:
    runs-on: ubuntu-latest
    # The CI wait loop below gives up after 30 minutes; this is the backstop.
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag is on default branch
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Pre-release tags (v1.0.0-dev.1, v1.0.0-beta.1) skip this check
          # so dev builds can happen from feature branches.
          case "$GITHUB_REF_NAME" in
            *-dev.*|*-alpha.*|*-beta.*|*-rc.*) echo "Pre-release tag — skipping branch check."; exit 0 ;;
          esac
          if ! git merge-base --is-ancestor "$GITHUB_SHA" "origin/$DEFAULT_BRANCH"; then
            echo "::error::Tag $GITHUB_REF_NAME is not on $DEFAULT_BRANCH. Releases come from the default branch only."
            echo "Use a pre-release tag (e.g., v1.0.0-dev.1) for feature branch builds." >&2
            exit 1
          fi

      - name: Verify tag matches the version in the tagged commit
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pkg_version="$(node -p "require('./package.json').version")"
          gradle_version="$(sed -n 's/^[[:space:]]*versionName[[:space:]]*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -1)"
          if [ -z "$pkg_version" ] || [ -z "$gradle_version" ]; then
            echo "::error::Could not read the version from package.json or android/app/build.gradle. Refusing to publish."
            exit 1
          fi
          if [ "$pkg_version" != "$gradle_version" ]; then
            echo "::error::package.json declares ${pkg_version} but build.gradle versionName is ${gradle_version}."
            exit 1
          fi
          tag_version="${TAG#v}"
          tag_version="${tag_version%%-*}"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $TAG is on a commit that declares ${pkg_version}. Merge the release first, then tag the merged commit."
            exit 1
          fi

      - name: Require a passing CI run for this commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          deadline=$(( $(date +%s) + 1800 ))
          while true; do
            runs=$(gh api \
              "repos/${REPO}/actions/workflows/build-apk.yml/runs?head_sha=${SHA}&per_page=100" \
              --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.html_url)"')

            if [ -z "$runs" ]; then
              echo "::error::CI has never run for ${SHA}, so nothing has tested this commit."
              echo "Push the branch so CI runs on it, or dispatch it by hand" >&2
              echo "(Actions -> Build Check -> Run workflow), then re-tag." >&2
              exit 1
            fi

            if printf '%s\n' "$runs" | awk '$2 == "success" { hit = 1 } END { exit !hit }'; then
              echo "CI passed for ${SHA}."
              exit 0
            fi

            unfinished=$(printf '%s\n' "$runs" | awk '$1 != "completed"' | wc -l)
            if [ "$unfinished" -eq 0 ]; then
              echo "::error::CI ran for ${SHA} and did not pass. Refusing to release."
              printf '%s\n' "$runs" | sed 's/^/  /' >&2
              exit 1
            fi

            echo "CI is still running for ${SHA} (${unfinished} unfinished) -- waiting."
            if [ "$(date +%s)" -ge "$deadline" ]; then
              echo "::error::Timed out waiting for CI on ${SHA} to finish."
              exit 1
            fi
            sleep 20
          done

  release:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Holds the keystore secrets; its protection rules gate every signing run
    environment: apk-signing
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: use Node.js LTS
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 'lts/*'
          cache: 'npm'

      - name: install dependencies
        run: npm ci

      - name: build Nuxt project
        run: npm run generate

      # Copies the built web assets into android/ and installs the native
      # plugins. It runs before any secret touches the disk.
      - name: copy to Android project
        run: npx cap sync android

      # Capacitor 7 needs JDK 21.
      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'temurin'
          java-version: '21'

      # Also validates every Gradle wrapper jar in the repo against Gradle's
      # published checksums, so a tampered gradle-wrapper.jar fails here.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        with:
          cache-provider: basic

      # The keystore goes to $RUNNER_TEMP, outside the checkout, and only
      # after every install step above, so no package install script ever
      # runs with it on disk. android/app/build.gradle reads the path and
      # passwords from the environment in its release signingConfig.
      - name: decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: build release APK
        working-directory: android
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: audiobookshelf
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: delete keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - name: rename APK
        id: apk
        run: |
          set -euo pipefail
          src=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$src" ]; then
            echo "::error::No APK found at $src"
            exit 1
          fi
          dest="audiobookshelf-${GITHUB_REF_NAME}.apk"
          mv "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ steps.apk.outputs.path }}

      - name: extract release notes
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [ -f CHANGELOG.md ]; then
            awk -v v="$version" '
              $0 ~ "^## \\[" v "\\]" { flag = 1; next }
              flag && /^## \[/ { exit }
              flag { print }
            ' CHANGELOG.md > release-notes.md
          fi
          if [ ! -s release-notes.md ]; then
            echo "Release $version" > release-notes.md
          fi

      # The path goes through env:, never ${{ }} inside run: -- an expression
      # there is pasted into the script as code before bash ever sees it.
      - name: create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APK_PATH: ${{ steps.apk.outputs.path }}
        run: |
          set -euo pipefail
          prerelease_flag=""
          case "$GITHUB_REF_NAME" in
            *-dev.*|*-alpha.*|*-beta.*|*-rc.*) prerelease_flag="--prerelease" ;;
          esac
          gh release create "$GITHUB_REF_NAME" \
            "$APK_PATH" \
            --title "$GITHUB_REF_NAME" \
            --notes-file release-notes.md \
            $prerelease_flag

      - name: verify release has APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          assets="$(gh release view "$GITHUB_REF_NAME" --json assets --jq '.assets[].name')"
          echo "Assets: $assets"
          echo "$assets" | grep -q '\.apk$' || {
            echo "::error::Release published without an APK attached."
            exit 1
          }
